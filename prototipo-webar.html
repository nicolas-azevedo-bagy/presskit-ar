<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Protótipo WebAR - AR.js</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    .overlay {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      color: white;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      z-index: 999;
      pointer-events: none;
      font-size: 14px;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <div class="overlay">Aponte a câmera para o marcador Hiro</div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
  >
    <a-marker preset="hiro">

      <!-- Objeto animado de exemplo: troque por seu modelo .glb depois -->
      <a-box
        position="0 0.5 0"
        color="#E63946"
        depth="1" height="1" width="1"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
      ></a-box>

      <a-torus
        position="0 1.6 0"
        color="#F4A261"
        radius="0.5"
        radius-tubular="0.05"
        animation="property: rotation; to: 360 0 0; loop: true; dur: 3000; easing: linear"
        animation__scale="property: scale; dir: alternate; loop: true; dur: 1000; to: 1.2 1.2 1.2"
      ></a-torus>

      <a-text
        value="PRESSKIT AR"
        position="0 2.3 0"
        align="center"
        color="#1D3557"
        width="4"
      ></a-text>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
